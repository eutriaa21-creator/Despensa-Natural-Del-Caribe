spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/control_vencimientos?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.main.banner-mode=off
logging.level.root=WARN
app.console.enabled=${APP_CONSOLE_ENABLED:false}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${APP_SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${APP_SESSION_COOKIE_SECURE:false}
