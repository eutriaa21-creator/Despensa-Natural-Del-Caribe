services:
  - type: web
    name: despensa-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /auth/status
    envVars:
      - key: PORT
        value: "10000"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://despensa-natural-del-caribe-fronten.vercel.app
      - key: APP_SESSION_COOKIE_SAME_SITE
        value: none
      - key: APP_SESSION_COOKIE_SECURE
        value: "true"
