    <style>

      p { color: #526078; line-height: 1.6; }
      .status { display: inline-block; padding: .4rem .7rem; color: #17633a; background: #e8f7ee; border-radius: 999px; font-size: .9rem; }

  <body>
    <main>
      <span class="status">Sitio de prueba listo</span>
      <h1>Control de vencimientos</h1>
      <p>Este despliegue confirma que la carpeta de prueba se sirve correctamente en Vercel.</p>
      <p>La interfaz y la conexión con la API se incorporarán en una siguiente etapa.</p>
    </main>
